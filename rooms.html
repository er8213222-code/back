<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>minimini.exe</title>

<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: black;
  color: white;
  font-family: 'Press Start 2P', monospace;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  overflow: hidden;
}

/* FONDO ORIGINAL */
.fondo {
  position: fixed;
  inset: 0;
  z-index: -3;
  background: url("fondo.jpg") center / cover no-repeat;
  image-rendering: pixelated;
  filter: brightness(.48) contrast(1.4);
}

/* EFECTO DE PANTALLA RETRO */
.scanlines {
  position: fixed;
  inset: 0;
  z-index: -2;
  pointer-events: none;
  background: repeating-linear-gradient(
    to bottom,
    transparent 0px,
    transparent 3px,
    rgba(0,0,0,.3) 4px
  );
}

.contenido {
  width: 96%;
  max-width: 950px;
  padding: 20px 8px;
}

h1 {
  font-size: clamp(15px, 4vw, 35px);
  line-height: 1.8;
  color: #ff3344;
  text-shadow: 4px 4px #650000;
  margin-bottom: 35px;
}

#contador {
  font-size: clamp(15px, 4.5vw, 45px);
  line-height: 1.8;
  font-variant-numeric: tabular-nums;
  color: white;
  text-shadow:
    4px 4px #990000,
    0 0 20px red;
}

.etiquetas {
  font-size: clamp(7px, 1.4vw, 12px);
  color: #ff7788;
  margin-top: 20px;
  line-height: 2;
}

/* MENSAJE DE ECLOSIÓN */
#mensajeFinal {
  display: none;
  font-size: clamp(16px, 4vw, 42px);
  line-height: 2;
  color: white;
  text-shadow:
    4px 4px #ff0033,
    0 0 25px red;
  animation: glitch .35s infinite;
}

/* BOTONES PIXELADOS */
.boton {
  display: inline-block;
  font-family: inherit;
  font-size: clamp(9px, 2vw, 12px);
  line-height: 1.8;
  margin-top: 30px;
  padding: 16px;
  color: white;
  background: #180000;
  border: 3px solid #ff3344;
  text-decoration: none;
  cursor: pointer;
  box-shadow: 5px 5px 0 #700000;
}

.boton:active {
  transform: translate(3px, 3px);
  box-shadow: 2px 2px 0 #700000;
}

#pantallaFinal {
  display: none;
}

@keyframes glitch {
  0%,100% { transform: translate(0); }
  25% { transform: translate(-3px,2px); }
  50% { transform: translate(3px,-2px); }
  75% { transform: translate(-2px,1px); }
}
</style>
</head>

<body>

<div class="fondo"></div>
<div class="scanlines"></div>

<main class="contenido">

  <!-- ANTES DE LA ECLOSIÓN -->
  <div id="espera">
    <h1>PRÓXIMAMENTE</h1>

    <div id="contador">00:00:00:00</div>

    <div class="etiquetas">
      DÍAS : HORAS : MIN : SEG
    </div>

    <button class="boton" id="activar">
      ACTIVAR SONIDO 🔊
    </button>
  </div>

  <!-- DESPUÉS DE LA ECLOSIÓN -->
  <div id="pantallaFinal">

    <div id="mensajeFinal">
      mini mini.exe ha eclosionado
    </div>

    <a
      class="boton"
      href="https://www.google.com/maps/search/?api=1&amp;query=19.340435%2C-99.176822"
      target="_blank"
      rel="noopener noreferrer"
    >
      📍 UBICACIONES DEL SUCESO
    </a>

    <div>
      <button class="boton" id="reproducir">
        🔊 REPRODUCIR SONIDO
      </button>
    </div>

  </div>

</main>

<!-- TU AUDIO DE ECLOSIÓN -->
<audio
  id="audioFinal"
  src="minimini.mp3"
  preload="auto">
</audio>

<script>

// FECHA DE ECLOSIÓN
// 5 NOVIEMBRE 2026 - 9:00 PM CDMX
const fechaFinal = new Date(
  "2026-11-05T21:00:00-06:00"
).getTime();

const espera = document.getElementById("espera");
const contador = document.getElementById("contador");
const pantallaFinal = document.getElementById("pantallaFinal");
const mensaje = document.getElementById("mensajeFinal");
const activar = document.getElementById("activar");
const reproducir = document.getElementById("reproducir");
const audio = document.getElementById("audioFinal");

let contextoAudio = null;
let sonidoActivo = false;
let terminado = false;
let ultimoSegundo = null;

// PITIDO RETRO DE CADA SEGUNDO
function pip() {
  if (!sonidoActivo || !contextoAudio) return;
  if (contextoAudio.state !== "running") return;

  const oscilador = contextoAudio.createOscillator();
  const volumen = contextoAudio.createGain();

  oscilador.type = "square";
  oscilador.frequency.value = 650;

  volumen.gain.setValueAtTime(
    0.035,
    contextoAudio.currentTime
  );

  volumen.gain.exponentialRampToValueAtTime(
    0.001,
    contextoAudio.currentTime + 0.07
  );

  oscilador.connect(volumen);
  volumen.connect(contextoAudio.destination);

  oscilador.start();
  oscilador.stop(
    contextoAudio.currentTime + 0.07
  );
}

// ACTIVAR PITIDOS
activar.addEventListener("click", async () => {
  try {
    contextoAudio = contextoAudio ||
      new (window.AudioContext ||
           window.webkitAudioContext)();

    await contextoAudio.resume();

    sonidoActivo = true;
    audio.load();

    activar.textContent = "SONIDO ACTIVADO ✓";
    pip();

  } catch (error) {
    activar.textContent = "REINTENTAR SONIDO";
  }
});

// REPRODUCIR SONIDO FINAL MANUALMENTE
reproducir.addEventListener("click", () => {
  audio.currentTime = 0;
  audio.play().catch(() => {});
});

// MOSTRAR ECLOSIÓN
function eclosionar() {
  if (terminado) return;

  terminado = true;

  espera.style.display = "none";
  pantallaFinal.style.display = "block";
  mensaje.style.display = "block";

  // INTENTAR REPRODUCIR TU MP3
  if (sonidoActivo) {
    audio.currentTime = 0;
    audio.play().catch(() => {
      // Si el navegador bloquea autoplay,
      // se puede usar el botón manual.
    });
  }

  clearInterval(intervalo);
}

// ACTUALIZAR CRONÓMETRO
function actualizar() {
  const restante = Math.max(
    0,
    fechaFinal - Date.now()
  );

  if (restante <= 0) {
    eclosionar();
    return;
  }

  const segundosTotales = Math.ceil(
    restante / 1000
  );

  const dias = Math.floor(
    segundosTotales / 86400
  );

  const horas = Math.floor(
    (segundosTotales % 86400) / 3600
  );

  const minutos = Math.floor(
    (segundosTotales % 3600) / 60
  );

  const segundos = segundosTotales % 60;

  const formato = n =>
    String(n).padStart(2, "0");

  contador.textContent =
    `${formato(dias)}:${formato(horas)}:` +
    `${formato(minutos)}:${formato(segundos)}`;

  // PITIDO CADA SEGUNDO
  if (
    ultimoSegundo !== null &&
    segundosTotales !== ultimoSegundo
  ) {
    pip();
  }

  ultimoSegundo = segundosTotales;
}

// INICIAR
actualizar();

const intervalo = setInterval(
  actualizar,
  100
);

</script>

</body>
</html>
